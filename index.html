


<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Palubní počítač</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;800&family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <style>
    :root{--text:#e1f7ff;--muted:#81aabd;--cyan:#62eeff;--amber:#ffd16b;--red:#ff5b7b;--green:#79ffb2;--blue:#8fa8ff}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:radial-gradient(circle at top,#102035 0%,#050a12 45%,#02050a 100%);color:var(--text)}body{font-family:'Share Tech Mono',monospace}.wrap{min-height:100vh;padding:18px;display:grid;grid-template-rows:auto 1fr;gap:16px}.topbar,.screen{background:linear-gradient(180deg,rgba(13,24,40,.95),rgba(6,13,22,.95));border:1px solid rgba(98,238,255,.18);border-radius:18px;box-shadow:0 0 0 1px rgba(98,238,255,.08),0 0 28px rgba(98,238,255,.06),inset 0 0 26px rgba(98,238,255,.03)}.topbar{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:18px 24px}.label{color:var(--muted);font-size:.82rem}.title,.timer,.msg-title,.status{font-family:'Orbitron',sans-serif;letter-spacing:.08em;text-transform:uppercase}.title{font-size:clamp(1.35rem,2.5vw,2.1rem)}.timer{font-size:clamp(2.15rem,5vw,3.7rem);color:var(--amber);text-shadow:0 0 14px rgba(255,209,107,.28)}.screen{padding:20px;overflow:auto;background-image:repeating-linear-gradient(180deg,rgba(98,238,255,.045) 0,rgba(98,238,255,.045) 2px,transparent 2px,transparent 6px),linear-gradient(180deg,rgba(2,14,22,.96),rgba(5,20,30,.94))}.messages{display:grid;gap:12px;align-content:start}.message{border-left:5px solid var(--cyan);background:rgba(98,238,255,.055);border-radius:14px;padding:13px 16px 11px;box-shadow:inset 0 0 0 1px rgba(98,238,255,.1)}.message.warning{border-left-color:var(--amber);background:rgba(255,209,107,.08)}.message.critical{border-left-color:var(--red);background:rgba(255,91,123,.1)}.message.success{border-left-color:var(--green);background:rgba(121,255,178,.08)}.message.info{border-left-color:var(--blue);background:rgba(143,168,255,.08)}.head{display:flex;justify-content:space-between;align-items:start;gap:12px;margin-bottom:6px}.msg-title{font-size:clamp(.92rem,1.45vw,1.2rem)}.msg-code,.msg-meta{color:var(--muted);font-size:.82rem}.msg-text{font-size:clamp(.92rem,1.2vw,1.08rem);line-height:1.42;max-width:72ch}.msg-meta{margin-top:8px}.status{font-size:.68rem;color:var(--cyan);padding:7px 10px;border:1px solid rgba(98,238,255,.2);border-radius:999px;background:rgba(98,238,255,.08)}.empty{min-height:40vh;display:grid;place-items:center;text-align:center;color:var(--muted);border:1px dashed rgba(98,238,255,.12);border-radius:16px}.error{color:#ffd4dc;border-color:rgba(255,91,123,.28);background:rgba(255,91,123,.07)}@media(max-width:860px){.topbar{flex-direction:column;align-items:flex-start}.timer{align-self:flex-end}.wrap{padding:12px}.screen{padding:14px}}
  </style>
</head>
<body><div class="wrap"><header class="topbar"><div><div class="label">Aktivní hlášení</div><div class="title">Stav mateřské lodi</div></div><div class="timer" id="timer">105:00</div></header><main class="screen"><div class="messages" id="messages"></div></main></div>
<script>
  const GOOGLE_SHEET_CSV_URL='https://docs.google.com/spreadsheets/d/e/2PACX-1vQMNCzWSMUDvVLyPFQQTASOa4lPwRgJqf9EVekqjZ1rfpvogk7zocqmndMMww2IDpDkbTcHGXldS1GP/pub?gid=0&single=true&output=csv';
  const POLL_MS=4000, START_SECONDS=105*60;
  const messagesEl=document.getElementById('messages'),timerEl=document.getElementById('timer');
  const STORE='vesmirna-lod-v2';
  let state=loadState();
  function loadState(){try{const s=JSON.parse(localStorage.getItem(STORE));if(s&&s.end&&Array.isArray(s.usedTimeIds))return s}catch(e){}return{end:Date.now()+START_SECONDS*1000,usedTimeIds:[]}}
  function saveState(){try{localStorage.setItem(STORE,JSON.stringify(state))}catch(e){console.warn('Prohlížeč nepovolil uložení stavu.',e)}}
  function format(sec){sec=Math.max(0,sec);return`${String(Math.floor(sec/60)).padStart(2,'0')}:${String(sec%60).padStart(2,'0')}`}
  function renderTimer(){timerEl.textContent=format(Math.floor((state.end-Date.now())/1000))}
  function parseCsv(text){const rows=[];let row=[],value='',quoted=false;for(let i=0;i<text.length;i++){const ch=text[i],next=text[i+1];if(ch==='"'){if(quoted&&next==='"'){value+='"';i++}else quoted=!quoted}else if(ch===','&&!quoted){row.push(value);value=''}else if((ch==='\n'||ch==='\r')&&!quoted){if(ch==='\r'&&next==='\n')i++;row.push(value);value='';if(row.some(x=>x!==''))rows.push(row);row=[]}else value+=ch}if(value.length||row.length){row.push(value);rows.push(row)}if(!rows.length)return[];const h=rows[0].map(x=>x.trim());return rows.slice(1).map(r=>Object.fromEntries(h.map((x,i)=>[x,(r[i]||'').trim()])))}
  function esc(s){const x=document.createElement('div');x.textContent=s||'';return x.innerHTML}function visible(v){return['1','true','ano','yes'].includes(String(v).trim().toLowerCase())}
  function renderMessages(rows){messagesEl.innerHTML='';const active=rows.filter(r=>(r.action||'').toLowerCase()==='show'&&visible(r.visible)&&r.id);if(!active.length){messagesEl.innerHTML='<div class="empty"><div><div class="label">Čekám na další přenos</div><div class="title" style="font-size:1.2rem;margin-top:8px">Žádné aktivní chyby</div></div></div>';return}active.forEach(r=>{const level=(r.level||'info').toLowerCase(),card=document.createElement('article');card.className=`message ${level}`;card.innerHTML=`<div class="head"><div><div class="msg-title">${esc(r.title)}</div><div class="msg-code">Kód události: ${esc(r.code||r.id)}</div></div><div class="status">${esc(level)}</div></div><div class="msg-text">${esc(r.text)}</div><div class="msg-meta">Aktivní porucha</div>`;messagesEl.appendChild(card)})}
  function applyTimeRows(rows){rows.filter(r=>(r.action||'').toLowerCase()==='time'&&visible(r.visible)&&r.id).forEach(r=>{if(state.usedTimeIds.includes(r.id))return;const delta=Number(r.secondsDelta)||0;state.end+=delta*1000;state.usedTimeIds.push(r.id);saveState();renderTimer()})}
  async function sync(){try{const res=await fetch(GOOGLE_SHEET_CSV_URL,{cache:'no-store'});if(!res.ok)throw new Error(`HTTP ${res.status}`);const rows=parseCsv(await res.text());renderMessages(rows);applyTimeRows(rows)}catch(e){messagesEl.innerHTML=`<div class="empty error"><div><div class="label">Chyba načítání Google Sheetu</div><div class="msg-meta" style="margin-top:10px">${esc(e.message)}</div></div></div>`}}
  setInterval(renderTimer,250);renderTimer();sync();setInterval(sync,POLL_MS);
</script></body></html>
