<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Palubní počítač – hlášení</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;800&family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <style>
    :root{--text:#e1f7ff;--muted:#81aabd;--cyan:#62eeff;--amber:#ffd16b;--red:#ff5b7b;--green:#79ffb2;--blue:#8fa8ff}
    *{box-sizing:border-box} html,body{margin:0;min-height:100%;background:radial-gradient(circle at top,#102035 0%,#050a12 45%,#02050a 100%);color:var(--text)} body{font-family:'Share Tech Mono',monospace}
    .wrap{min-height:100vh;padding:18px;display:grid;grid-template-rows:auto 1fr;gap:16px}.topbar,.screen{background:linear-gradient(180deg,rgba(13,24,40,.95),rgba(6,13,22,.95));border:1px solid rgba(98,238,255,.18);border-radius:18px;box-shadow:0 0 0 1px rgba(98,238,255,.08),0 0 28px rgba(98,238,255,.06),inset 0 0 26px rgba(98,238,255,.03)}
    .topbar{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:18px 24px}.label{color:var(--muted);font-size:.82rem}.title,.timer,.msg-title,.status{font-family:'Orbitron',sans-serif;letter-spacing:.08em;text-transform:uppercase}.title{font-size:clamp(1.35rem,2.5vw,2.1rem)}.timer{font-size:clamp(2.15rem,5vw,3.7rem);color:var(--amber);text-shadow:0 0 14px rgba(255,209,107,.28)}
    .screen{padding:20px;overflow:auto;background-image:repeating-linear-gradient(180deg,rgba(98,238,255,.045) 0,rgba(98,238,255,.045) 2px,transparent 2px,transparent 6px),linear-gradient(180deg,rgba(2,14,22,.96),rgba(5,20,30,.94))}.messages{display:grid;gap:12px;align-content:start}
    .message{border-left:5px solid var(--cyan);background:rgba(98,238,255,.055);border-radius:14px;padding:13px 16px 11px;box-shadow:inset 0 0 0 1px rgba(98,238,255,.1);animation:enter .28s ease}.message.warning{border-left-color:var(--amber);background:rgba(255,209,107,.08)}.message.critical{border-left-color:var(--red);background:rgba(255,91,123,.1)}.message.success{border-left-color:var(--green);background:rgba(121,255,178,.08)}.message.info{border-left-color:var(--blue);background:rgba(143,168,255,.08)}
    .head{display:flex;justify-content:space-between;align-items:start;gap:12px;margin-bottom:6px}.msg-title{font-size:clamp(.92rem,1.45vw,1.2rem)}.msg-code,.msg-meta{color:var(--muted);font-size:.82rem}.msg-text{font-size:clamp(.92rem,1.2vw,1.08rem);line-height:1.42;max-width:72ch}.msg-meta{margin-top:8px}.status{font-size:.68rem;color:var(--cyan);padding:7px 10px;border:1px solid rgba(98,238,255,.2);border-radius:999px;background:rgba(98,238,255,.08)}.empty{min-height:40vh;display:grid;place-items:center;text-align:center;color:var(--muted);border:1px dashed rgba(98,238,255,.12);border-radius:16px}.blink{animation:blink 1.05s step-end infinite}@keyframes blink{50%{opacity:.4}}@keyframes enter{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
    @media(max-width:860px){.topbar{flex-direction:column;align-items:flex-start}.timer{align-self:flex-end}.wrap{padding:12px}.screen{padding:14px}}
  </style>
</head>
<body>
  <div class="wrap">
    <header class="topbar"><div><div class="label">Aktivní hlášení</div><div class="title">Stav mateřské lodi</div></div><div class="timer" id="timer">105:00</div></header>
    <main class="screen"><div class="messages" id="messages"></div></main>
  </div>

  <script>
    // TVŮJ PUBLIKOVANÝ GOOGLE SHEETS CSV LINK:
    const GOOGLE_SHEET_CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQMNCzWSMUDvVLyPFQQTASOa4lPwRgJqf9EVekqjZ1rfpvogk7zocqmndMMww2IDpDkbTcHGXldS1GP/pub?gid=0&single=true&output=csv';
    const POLL_MS = 3000;
    const START_SECONDS = 105 * 60;

    const messagesEl = document.getElementById('messages');
    const timerEl = document.getElementById('timer');
    const params = new URLSearchParams(window.location.search);
    let eventHashes = new Set();
    let activeMessages = new Map();
    let hiddenIds = new Set();
    let currentEndTs = initEndTimestamp();

    function initEndTimestamp(){
      const end = Number(params.get('end'));
      if(Number.isFinite(end) && end > Date.now()) return end;
      const newEnd = Date.now() + START_SECONDS * 1000;
      writeStateToUrl(newEnd);
      return newEnd;
    }
    function writeStateToUrl(endTs){const url=new URL(window.location.href);url.searchParams.set('end',String(endTs));history.replaceState({},'',url.toString())}
    function formatTime(s){s=Math.max(0,s);return `${Math.floor(s/60).toString().padStart(2,'0')}:${Math.floor(s%60).toString().padStart(2,'0')}`}
    function renderTimer(){timerEl.textContent=formatTime(Math.max(0,Math.floor((currentEndTs-Date.now())/1000)))}
    function shiftTime(delta){currentEndTs+=delta*1000;writeStateToUrl(currentEndTs);renderTimer()}
    setInterval(renderTimer,250);renderTimer();

    function parseCsv(text){
      const rows=[];let row=[],value='',inQuotes=false;
      for(let i=0;i<text.length;i++){const ch=text[i],next=text[i+1];if(ch==='"'){if(inQuotes&&next==='"'){value+='"';i++}else inQuotes=!inQuotes}else if(ch===','&&!inQuotes){row.push(value);value=''}else if((ch==='\n'||ch==='\r')&&!inQuotes){if(ch==='\r'&&next==='\n')i++;row.push(value);value='';if(row.some(cell=>cell!==''))rows.push(row);row=[]}else value+=ch}
      if(value.length||row.length){row.push(value);rows.push(row)}if(!rows.length)return[];const headers=rows[0].map(h=>h.trim());return rows.slice(1).map(r=>Object.fromEntries(headers.map((h,i)=>[h,(r[i]||'').trim()])));
    }
    function normalize(row){return{id:row.id||row.ID||`row-${Math.random().toString(36).slice(2,8)}`,title:row.title||row.nadpis||'Neznámá chyba',text:row.text||row.message||row.popis||'',level:(row.level||row.priorita||'info').toLowerCase(),action:(row.action||row.akce||'show').toLowerCase(),code:row.code||row.kod||row.id||'SYS-000',secondsDelta:Number(row.secondsDelta||row.time||row.cas||0)||0,visible:String(row.visible||row.zobrazit||'1').trim()}}
    function ensureEmpty(){if(messagesEl.children.length===0)messagesEl.innerHTML='<div class="empty"><div><div class="label">Čekám na další přenos</div><div class="title" style="font-size:1.2rem;margin-top:8px">Žádné aktivní chyby</div></div></div>'}
    function clearEmpty(){const x=messagesEl.querySelector('.empty');if(x)x.remove()}
    function showMessage(item){
      if(hiddenIds.has(item.id)||activeMessages.has(item.id))return;clearEmpty();
      const now=new Date().toLocaleTimeString('cs-CZ',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
      const card=document.createElement('article');card.className=`message ${item.level}`;card.innerHTML=`<div class="head"><div><div class="msg-title"></div><div class="msg-code"></div></div><div class="status blink"></div></div><div class="msg-text"></div><div class="msg-meta"></div>`;
      card.querySelector('.msg-title').textContent=item.title;card.querySelector('.msg-code').textContent=`Kód události: ${item.code}`;card.querySelector('.status').textContent=item.level;card.querySelector('.msg-text').textContent=item.text;card.querySelector('.msg-meta').textContent=`Přijato ${now} · priorita ${item.level}`;
      messagesEl.prepend(card);activeMessages.set(item.id,card);
    }
    function hideMessage(id){hiddenIds.add(id);const card=activeMessages.get(id);if(card){card.remove();activeMessages.delete(id)}ensureEmpty()}
    function clearAll(){activeMessages.forEach(card=>card.remove());activeMessages.clear();messagesEl.innerHTML='';ensureEmpty()}
    async function loadRemote(){
      try{
        const res=await fetch(GOOGLE_SHEET_CSV_URL,{cache:'no-store'});if(!res.ok)throw new Error(`HTTP ${res.status}`);
        parseCsv(await res.text()).map(normalize).forEach(row=>{
          const hash=`${row.action}|${row.id}|${row.title}|${row.text}|${row.level}|${row.code}|${row.secondsDelta}|${row.visible}`;
          if(eventHashes.has(hash))return;eventHashes.add(hash);
          if(row.visible==='0'){hideMessage(row.id);return}
          if(row.action==='hide'){hideMessage(row.id);return}
          if(row.action==='clear'){clearAll();return}
          if(row.action==='time'){shiftTime(row.secondsDelta);return}
          if(row.action==='show')showMessage(row);
        });ensureEmpty();
      }catch(err){console.error('Google Sheet se nepodařilo načíst:',err)}
    }
    ensureEmpty();loadRemote();setInterval(loadRemote,POLL_MS);
  </script>
</body>
</html>
